# Detekt configuration for A+ Study House (BlankApp)
# Run: ./gradlew detekt  (baseline at app/detekt-baseline.xml)
# Quality gate is advisory only — it does NOT fail the release build.

build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1

config:
  validation: false
  warningsAsErrors: false
  excludes:
    - "**/build/**"
    - "**/test/**"

console-reports:
  active: true
  exclude:
    - ProjectStatisticsReport
    - ComplexityReport
    - NotificationReport
    - FindingsReport
