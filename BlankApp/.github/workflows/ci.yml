name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Continuous test/build gate on main. Signed APK publishing to GitHub
# Releases happens in the separate tag-triggered workflow
# (.github/workflows/build-release.yml), not here.

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: actions/setup-gradle@v3

    - name: Build + unit tests
      run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

    - name: Upload test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-on-failure
        path: app/build/reports/tests/testDebugUnitTest/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/test-results/testDebugUnitTest/
        retention-days: 7

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: app/build/reports/tests/testDebugUnitTest/
        retention-days: 7

    - name: Upload release APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4
