name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Continuous test/build gate on main. Signed APK publishing to GitHub
# Releases happens in the separate tag-triggered workflow
# (.github/workflows/build-release.yml), not here.

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: actions/setup-gradle@v3

    - name: Build + unit tests + coverage
      working-directory: BlankApp
      run: ./gradlew assembleDebug testDebugUnitTest jacocoTestReport --no-daemon --stacktrace

    - name: Upload JaCoCo coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage
        path: |
          BlankApp/app/build/reports/jacoco/jacocoTestReport/
          BlankApp/app/build/reports/tests/testDebugUnitTest/
        retention-days: 14
        if-no-files-found: warn

    - name: Upload test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-on-failure
        path: BlankApp/app/build/reports/tests/testDebugUnitTest/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: BlankApp/app/build/test-results/testDebugUnitTest/
        retention-days: 7

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: BlankApp/app/build/reports/tests/testDebugUnitTest/
        retention-days: 7

    - name: Upload release APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: BlankApp/app/build/outputs/apk/release/app-release.apk
        retention-days: 7

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Decode signing keystore
      working-directory: BlankApp
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > aplus-study-house.jks

    - name: Write keystore.properties
      env:
        STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        cd BlankApp
        printf 'storeFile=../aplus-study-house.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
          "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

    - name: Build signed release APK
      working-directory: BlankApp
      run: ./gradlew assembleRelease --console=plain

    - name: Attach APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: BlankApp/app/build/outputs/apk/release/app-release.apk
        fail_on_unmatched_files: true

